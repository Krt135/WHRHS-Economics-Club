<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account action – The Economic Forum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styleFolder/auth.css">
  <link rel="icon" type="image/png" href="images/TEF-favicon-96.png">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js">
</head>

<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card auth-action-card">
      <h2>The Economic Forum</h2>
      <p id="actionSubtitle" class="auth-subtitle">Processing your request...</p>
      <div id="actionFeedback" class="auth-feedback" hidden></div>
      <form id="resetPasswordForm" class="hidden">
        <p id="resetEmailHint" class="auth-subtitle"></p>
        <div class="input-group">
          <label for="resetNewPassword">New password</label>
          <input type="password" id="resetNewPassword" placeholder="Min. 8 characters" required minlength="8">
        </div>
        <div class="input-group">
          <label for="resetConfirmPassword">Confirm password</label>
          <input type="password" id="resetConfirmPassword" placeholder="Re-enter password" required>
        </div>
        <button type="submit" class="auth-submit-btn">Update password</button>
      </form>
      <a href="auth.html" class="auth-link bold" style="display: inline-block; margin-top: 24px;">Go to Sign In →</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import {
      getAuth,
      applyActionCode,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { firebaseConfig } from "./scriptFolder/config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const params = new URLSearchParams(window.location.search);

    const mode = params.get("mode");
    const oobCode = params.get("oobCode");

    const subtitle = document.getElementById("actionSubtitle");
    const feedbackEl = document.getElementById("actionFeedback");
    const resetForm = document.getElementById("resetPasswordForm");

    // Mirrors setAuthFeedback() in scriptFolder/auth.js, using the same
    // .auth-feedback / .auth-feedback--success / --error classes from auth.css.
    function setFeedback(message, type) {
      if (!feedbackEl) return;
      feedbackEl.hidden = !message;
      feedbackEl.textContent = message;
      feedbackEl.className = "auth-feedback" + (type ? ` auth-feedback--${type}` : "");
    }

    if (mode === "verifyEmail" && oobCode) {
      subtitle.textContent = "Verifying your email...";
      applyActionCode(auth, oobCode)
        .then(() => {
          subtitle.textContent = "Email verified";
          setFeedback(
            "You can close this tab and sign in once the Exec Board approves your account.",
            "success"
          );
        })
        .catch((err) => {
          // A used or expired code is the common case: email scanners and
          // double-clicks open the link more than once, so the address is
          // often already verified by the time this runs.
          if (err && (err.code === "auth/invalid-action-code" || err.code === "auth/expired-action-code")) {
            subtitle.textContent = "Link already used or expired";
            setFeedback(
              "If you already opened this link, your email is verified and you can sign in once the Exec Board approves your account. Otherwise, try signing in and we will email you a new link.",
              "error"
            );
          } else {
            subtitle.textContent = "Verification failed";
            setFeedback("We couldn't verify your email right now. Please try the link again in a minute.", "error");
          }
        });
    } else if (mode === "resetPassword" && oobCode) {
      subtitle.textContent = "Choose a new password";
      verifyPasswordResetCode(auth, oobCode)
        .then((email) => {
          document.getElementById("resetEmailHint").textContent =
            `Resetting password for ${email}`;
          resetForm.classList.remove("hidden");
          resetForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const pass = document.getElementById("resetNewPassword").value;
            const confirm = document.getElementById("resetConfirmPassword").value;
            const submitBtn = resetForm.querySelector('button[type="submit"]');
            if (pass.length < 8) {
              setFeedback("Password must be at least 8 characters.", "error");
              return;
            }
            if (pass !== confirm) {
              setFeedback("Passwords do not match.", "error");
              return;
            }
            submitBtn.disabled = true;
            setFeedback("", "");
            try {
              await confirmPasswordReset(auth, oobCode, pass);
              resetForm.classList.add("hidden");
              subtitle.textContent = "Password updated";
              setFeedback(
                "Your password has been reset. You can sign in with your new password.",
                "success"
              );
            } catch (err) {
              const code = err && err.code;
              setFeedback(
                code === "auth/weak-password" ? "That password is too weak. Please choose a longer one." :
                (code === "auth/expired-action-code" || code === "auth/invalid-action-code")
                  ? "This reset link has expired or was already used. Request a new one from the sign-in page."
                  : "Could not update your password. Please try again.",
                "error"
              );
              submitBtn.disabled = false;
            }
          });
        })
        .catch(() => {
          subtitle.textContent = "Reset link invalid";
          setFeedback(
            "This reset link is invalid or has expired. Request a new one from the sign-in page.",
            "error"
          );
        });
    } else {
      subtitle.textContent = "Invalid link";
      setFeedback("Invalid or missing action code.", "error");
    }
  </script>

</body>

</html>
