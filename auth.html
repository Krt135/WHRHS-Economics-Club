            <div class="auth-logo">
                <img src = "images/TEF-image.jpeg">
            </div>
            <h2>Welcome to The Economic Forum</h2>
            <p class="auth-subtitle">Sign in to continue</p>

            <form id="signInForm">
                <div id="signInFeedback" class="auth-feedback" hidden></div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="signInEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signInPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-submit-btn">Sign in</button>
            </form>

            <div class="auth-footer">
                <a href="#" class="auth-link" onclick="showForgotPassword(event)">Forgot password?</a>
                <span>Need an account? <a href="#" class="auth-link bold" onclick="toggleAuthView(); return false;">Sign up</a></span>
            </div>
        </div>

        <div id="signUpView" class="auth-card hidden">
            <a href="#" class="back-link" onclick="showAuthView('signInView'); return false;">← Back to sign in</a>
            <h2>Create your account</h2>

            <form id="signUpForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="signUpEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signUpPassword" placeholder="Min. 8 characters" required minlength="8">
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signUpConfirm" placeholder="Re-enter password" required>
                </div>
                <button type="submit" class="auth-submit-btn">Create account</button>
            </form>
        </div>

        <div id="forgotPasswordView" class="auth-card hidden">
            <a href="#" class="back-link" onclick="showAuthView('signInView'); return false;">← Back to sign in</a>
            <h2>Reset your password</h2>
            <p class="auth-subtitle">We will email you a link to choose a new password.</p>
            <form id="forgotPasswordForm">
                <div id="forgotPasswordFeedback" class="auth-feedback" hidden></div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="forgotPasswordEmail" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="auth-submit-btn">Send reset link</button>
            </form>
        </div>

    </div>

    

    <script>
        const AUTH_VIEWS = ['signInView', 'signUpView', 'forgotPasswordView'];
        function showAuthView(activeId) {
            AUTH_VIEWS.forEach((id) => {
                document.getElementById(id)?.classList.toggle('hidden', id !== activeId);
            });
        }

        function toggleAuthView() {
            const signInHidden = document.getElementById('signInView').classList.contains('hidden');
            showAuthView(signInHidden ? 'signInView' : 'signUpView');
        }

        function showForgotPassword(e) {
            if (e) e.preventDefault();
            const signInEmail = document.getElementById('signInEmail')?.value.trim();
            const forgotInput = document.getElementById('forgotPasswordEmail');
            if (signInEmail && forgotInput) forgotInput.value = signInEmail;
            const feedback = document.getElementById('forgotPasswordFeedback');
            if (feedback) {
                feedback.hidden = true;
                feedback.textContent = '';
                feedback.className = 'auth-feedback';
            }
            showAuthView('forgotPasswordView');
        }
    </script>
    <script type="module" src="scriptFolder/auth.js"></script>
</body>
</html>
